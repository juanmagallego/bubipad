<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' https: http: data: blob:; connect-src 'self' data: blob: https://api.github.com;" />
  <title>BubiPad</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon128.png" />
  <link rel="apple-touch-icon" href="icons/icon192.png" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="vendor/monaco-bundle.css" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
  <div id="toolbar-wrap">
    <div id="toolbar">
      <div class="group">
        <button id="sidebar-toggle-btn" class="active" title="Mostrar/ocultar explorador (Ctrl+Shift+F)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/>
            <line x1="6" y1="2.5" x2="6" y2="13.5"/>
          </svg>
        </button>
        <button id="open-folder-btn" title="Abrir carpeta (Ctrl+O)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 5 a1 1 0 0 1 1 -1 h3 l1.2 1.6 h5.8 a1 1 0 0 1 1 1 v6 a1 1 0 0 1 -1 1 h-10 a1 1 0 0 1 -1 -1 Z"/>
            <path d="M2 6.5 h12"/>
          </svg>
        </button>
        <button id="github-btn" title="Abrir repositorio de GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 1.5 a6.5 6.5 0 0 0 -2.05 12.67 c0.32 0.06 0.44 -0.14 0.44 -0.31 c0 -0.15 -0.01 -0.66 -0.01 -1.2 c-1.8 0.33 -2.27 -0.44 -2.41 -0.84 c-0.08 -0.21 -0.43 -0.84 -0.74 -1.01 c-0.25 -0.14 -0.61 -0.47 -0.01 -0.48 c0.57 -0.01 0.97 0.52 1.11 0.74 c0.65 1.09 1.69 0.78 2.1 0.6 c0.07 -0.47 0.25 -0.78 0.46 -0.96 c-1.61 -0.18 -3.29 -0.8 -3.29 -3.58 c0 -0.79 0.28 -1.44 0.75 -1.95 c-0.08 -0.18 -0.33 -0.92 0.07 -1.92 c0 0 0.61 -0.2 2 0.75 a6.9 6.9 0 0 1 3.64 0 c1.39 -0.95 2 -0.75 2 -0.75 c0.4 1 0.15 1.74 0.07 1.92 c0.47 0.51 0.75 1.15 0.75 1.95 c0 2.79 -1.69 3.4 -3.31 3.58 c0.26 0.23 0.49 0.67 0.49 1.35 c0 0.98 -0.01 1.76 -0.01 2 c0 0.17 0.12 0.38 0.44 0.31 A6.5 6.5 0 0 0 8 1.5 Z"/>
          </svg>
        </button>
        <button id="save-btn" title="Guardar (Ctrl+S)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2.5 h8 l2.5 2.5 v8.5 a1 1 0 0 1 -1 1 h-9.5 a1 1 0 0 1 -1 -1 v-10 a1 1 0 0 1 1 -1 Z"/>
            <path d="M5.5 2.5 v3.2 h5 v-3.2 M5 9.2 h6 v4.3 h-6 Z"/>
          </svg>
        </button>
      </div>
      <div class="group">
        <button id="file-search-btn" title="Buscar archivo por nombre (Ctrl+P)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2 h5 l2.5 2.5 v9 a0.6 0.6 0 0 1 -0.6 0.6 h-6.9 a0.6 0.6 0 0 1 -0.6 -0.6 v-10.9 a0.6 0.6 0 0 1 0.6 -0.6 Z"/>
            <path d="M8 2 v2.5 h2.5"/>
            <circle cx="7" cy="10" r="1.8"/>
            <path d="M8.3 11.3 L9.8 12.8"/>
          </svg>
        </button>
        <button id="home-btn" title="Abrir archivo &quot;home&quot; (Ctrl+H)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 8 L8 2.5 L14 8"/>
            <path d="M3.5 6.8 V13 a0.6 0.6 0 0 0 0.6 0.6 h7.8 a0.6 0.6 0 0 0 0.6 -0.6 V6.8"/>
            <path d="M6.3 13.6 v-4 a0.6 0.6 0 0 1 0.6 -0.6 h2.2 a0.6 0.6 0 0 1 0.6 0.6 v4"/>
          </svg>
        </button>
        <button id="delete-line-btn" title="Eliminar línea (Ctrl+Shift+D)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 5.5 h10"/>
            <path d="M6.5 5.5 v-1.3 a1 1 0 0 1 1 -1 h1 a1 1 0 0 1 1 1 v1.3"/>
            <path d="M4.5 5.5 l0.7 6.5 a1 1 0 0 0 1 0.9 h3.6 a1 1 0 0 0 1 -0.9 l0.7 -6.5"/>
          </svg>
        </button>
        <button id="move-line-up-btn" title="Mover línea arriba (Alt+↑)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 13 V3"/>
            <path d="M4.5 6.5 L8 3 L11.5 6.5"/>
          </svg>
        </button>
        <button id="move-line-down-btn" title="Mover línea abajo (Alt+↓)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3 V13"/>
            <path d="M4.5 9.5 L8 13 L11.5 9.5"/>
          </svg>
        </button>
        <button id="text-btn" title="Modo texto plano, edición sencilla y con selección táctil nativa">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 4 h11 M2.5 8 h11 M2.5 12 h7"/>
          </svg>
        </button>
        <button id="edit-btn" title="Editor con resaltado de sintaxis (Ctrl+E alterna con Vista previa; doble clic en la vista previa)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 5 L2.5 8 L5.5 11"/>
            <path d="M10.5 5 L13.5 8 L10.5 11"/>
          </svg>
        </button>
        <button id="preview-btn" class="active" title="Vista previa Markdown, solo lectura (Ctrl+E)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.3 8 C3 4.5 6 3 8 3 s5 1.5 6.7 5 C13 11.5 10 13 8 13 s-5 -1.5 -6.7 -5 Z"/>
            <circle cx="8" cy="8" r="2.2"/>
          </svg>
        </button>
        <button id="undo-btn" title="Deshacer (Ctrl+Z)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5 H10 a3.5 3.5 0 0 1 0 7 H7"/>
            <path d="M6.3 3.8 L4 6.5 L6.3 9.2"/>
          </svg>
        </button>
        <button id="redo-btn" title="Rehacer (Ctrl+Y)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.5 H6 a3.5 3.5 0 0 0 0 7 H9"/>
            <path d="M9.7 3.8 L12 6.5 L9.7 9.2"/>
          </svg>
        </button>
        <button id="font-dec-btn" title="Reducir tamaño de letra (Ctrl+Shift+P)">
          <span class="font-btn-label">A⁻</span>
        </button>
        <button id="font-inc-btn" title="Aumentar tamaño de letra (Ctrl+Shift+G)">
          <span class="font-btn-label">A⁺</span>
        </button>
        <button id="outline-btn" title="Esquema de títulos del documento (Ctrl+Shift+M)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 3.5 h4.5"/>
            <path d="M5 7.5 h6.5"/>
            <path d="M7.5 11.5 h5.5"/>
          </svg>
        </button>
        <button id="search-btn" title="Buscar en el documento (Ctrl+F)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="7" r="4.8"/>
            <path d="M10.3 10.3 L14 14"/>
          </svg>
        </button>
        <button id="link-btn" title="Insertar enlace (Ctrl+K)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 9 a2.6 2.6 0 0 0 3.7 0 l1.6 -1.6 a2.6 2.6 0 0 0 -3.7 -3.7 L7.7 4.6"/>
            <path d="M9 7 a2.6 2.6 0 0 0 -3.7 0 l-1.6 1.6 a2.6 2.6 0 0 0 3.7 3.7 l0.9 -0.9"/>
          </svg>
        </button>
        <button id="f1-btn" title="Paleta de comandos de Monaco (F1), aplicable sobre texto seleccionado">
          <span class="font-btn-label">F1</span>
        </button>
        <button id="join-lines-btn" title="Unir líneas (Ctrl+J)">
          <span class="font-btn-label">J</span>
        </button>
      </div>
      <div class="group right">
        <button id="lang-es-btn" title="Corrector ortográfico: Español">
          <span class="font-btn-label">ES</span>
        </button>
        <button id="lang-eu-btn" title="Corrector ortográfico: Euskara">
          <span class="font-btn-label">EU</span>
        </button>
        <button id="lang-btn" title="Cargar diccionario desde una carpeta del disco (opcional)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="6.2"/>
            <path d="M1.8 8 h12.4 M8 1.8 a9 9 0 0 1 0 12.4 M8 1.8 a9 9 0 0 0 0 12.4"/>
          </svg>
        </button>
        <button id="theme-btn" title="Cambiar a modo claro">
          <svg id="theme-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="3.2"/>
            <path d="M8 1.5 v1.6 M8 12.9 v1.6 M1.5 8 h1.6 M12.9 8 h1.6 M3.4 3.4 l1.1 1.1 M11.5 11.5 l1.1 1.1 M3.4 12.6 l1.1 -1.1 M11.5 4.5 l1.1 -1.1"/>
          </svg>
        </button>
      </div>
    </div>
    <button id="toolbar-scroll-left" class="toolbar-scroll-btn toolbar-scroll-left" aria-label="Desplazar barra de herramientas a la izquierda">&#8249;</button>
    <button id="toolbar-scroll-right" class="toolbar-scroll-btn toolbar-scroll-right" aria-label="Desplazar barra de herramientas a la derecha">&#8250;</button>
  </div>
  <div id="workspace">
      <div id="sidebar" class="hidden">
        <div id="file-tree"></div>
      </div>
      <div id="main-panel">
        <div id="tab-bar"></div>
        <div id="empty-state">
          <p>Ningún archivo abierto</p>
          <p class="empty-hint">Crea uno nuevo (Ctrl+Shift+A) o abre uno del ordenador (Ctrl+Shift+O)</p>
        </div>
        <div id="editor"></div>
        <div id="text-view-wrap">
          <div id="text-view-highlight" aria-hidden="true"></div>
          <textarea id="text-view" spellcheck="true" autocapitalize="sentences" autocomplete="off" autocorrect="on"></textarea>
        </div>
        <div id="preview-view"></div>
      </div>
    </div>
    <div id="statusbar">
      <span id="status">Listo</span>
      <span id="word-count"></span>
    </div>
  </div>

  <div id="github-popup">
    <div id="github-status-text">Sin conectar</div>
    <input id="github-token-input" type="password" class="gh-input" placeholder="Token de acceso personal" autocomplete="off" />
    <input id="github-repo-input" type="text" class="gh-input" placeholder="usuario/repositorio" autocomplete="off" />
    <button id="github-connect-btn" class="wide">Conectar y abrir</button>
    <button id="github-forget-btn" class="wide">Olvidar credenciales</button>
  </div>

  <div id="file-search-popup">
    <input id="file-search-input" type="text" class="gh-input" placeholder="Buscar archivo por nombre…" autocomplete="off" />
    <div id="file-search-results"></div>
  </div>

  <div id="outline-popup">
    <div id="outline-status-text">Esquema del documento</div>
    <div id="outline-list"></div>
  </div>

  <div id="lang-popup">
    <div id="lang-status-text">Corrector: desactivado</div>
    <select id="lang-select"><option value="">Ninguno</option></select>
    <button id="lang-pick-folder-btn" class="wide">Elegir carpeta de diccionarios…</button>
  </div>

  <script src="storage-shim.js"></script>
  <script src="vendor/monaco-bundle.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
